name: Publish Docker image

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest

    if: startsWith(github.event.release.tag_name, 'v')

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: kubling/kubling-docs
          flavor: latest=false
          tags: |
            type=match,pattern=^v(.*)$,group=1,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=kubling-docs
          cache-to: type=gha,mode=max,scope=kubling-docs

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/kubling/kubling-docs
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true